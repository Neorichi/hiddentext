<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="jquery.min.js"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

  <div class="row" style="padding: 10px;width: 500px;">
    <div class="col-md-12">
      <h4 class="mb-3">Hidden Text</h4>
    </div>
    <div class="col-md-12">
      <label for="lastName">Text to send</label>
      <input type="text" class="form-control" id="text" style="font-size: 14px;">
    </div>
    <div class="col-md-12">
      <br>
      <form name="enablencrform">
        <label class="radio-inline"><input type="radio" name="enablencr" value="on">On</label>
        <label class="radio-inline"><input type="radio" name="enablencr" value="off">Off</label>
      </form>
    </div>
    <div class="col-md-12">
      <button id="set" class="btn btn-primary my-2">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
